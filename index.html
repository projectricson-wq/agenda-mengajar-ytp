<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Mengajar YTP</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a7cc2"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0}
:root{--b:#0a7cc2;--d:#0060a0;--r:#e00020;--g:#5fa312;--o:#e0a000;--p:#802080;--bg:#f2f8fd;--t:#12263a}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));color:#fff;background:linear-gradient(110deg,var(--d),var(--b) 60%,#2bb0e8)}
header img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px}
h1{font-size:17px}h2{font-size:16px;margin-bottom:8px}small{opacity:.85;font-size:12px}
#net{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:9px;background:#fff3}

.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0a3a5a1a}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.gw{display:flex;align-items:center;gap:14px}.gw svg{flex:none}
.big{font-size:26px;font-weight:700}.msg{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:600;line-height:1.35}
.k{background:#fff4d6;color:#7a5600}.p{background:#e6f5d3;color:#2f5f06}.l{background:#f3e0f3;color:#5c145c}

.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st div{border-radius:12px;padding:10px;color:#fff}.st b{display:block;font-size:22px}

.dy{font-weight:700;color:var(--d);margin:10px 0 4px}
.se{display:flex;gap:10px;padding:10px;border-radius:12px;background:#fff;margin-bottom:6px;border-left:5px solid var(--b)}
.se div:first-child{min-width:92px;font-weight:600;font-size:13px}.se small{display:block;color:#567}
.bt{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;color:#fff;background:var(--b);width:100%;margin-top:8px}
.bt.g{background:var(--g)}.bt.r{background:var(--r)}.bt.o{background:var(--o)}.bt.p{background:var(--p)}.bt.w{background:#e3edf5;color:var(--d)}
label{display:block;font-size:13px;font-weight:600;margin:9px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid #c5d9e8;border-radius:10px;font:inherit;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ck{display:flex;gap:8px;align-items:center}.ck input{width:20px;height:20px}
#ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border:1px solid var(--b);background:#fff;color:var(--b);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}.chip.on{background:var(--b);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d6e4ef;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{border:0;background:none;padding:9px 0 8px;font:inherit;font-size:12px;color:#567;border-top:3px solid transparent}nav button span{display:block;font-size:20px}
nav button.on{color:var(--d);font-weight:700;border-top-color:var(--r)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--r),var(--o));color:#fff;font-size:30px;box-shadow:0 4px 12px #0005;z-index:6}
dialog{border:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:auto auto 0;padding:16px;max-height:92vh}dialog::backdrop{background:#0008}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;font:11px Calibri,Arial,sans-serif;color:#000}@page{size:A4 landscape;margin:10mm}
#pr table{border-collapse:collapse;width:100%}#pr td,#pr th{border:1px solid #000;padding:3px 5px;text-align:center}#pr th{background:#8eaadb}#pr .nb td{border:0;text-align:left;padding:1px 4px}#pr tr{page-break-inside:avoid}}
</style></head><body>
<header><img src="icons/icon-192.png" alt=""><div><h1>Agenda Mengajar YTP</h1><small id="dt"></small></div><span id="net"></span></header>
<main id="v"></main><button id="fab" aria-label="Catat sesi">+</button>
<nav><button data-t="b"><span>📊</span>Beranda</button><button data-t="j"><span>📝</span>Jurnal</button><button data-t="u"><span>⬇️</span>Unduh</button><button data-t="f"><span>👤</span>Profil</button></nav>
<dialog id="f"></dialog><section id="pr"></section>
<script src="export.js"></script>
<script>
const K='ytp-agenda',$=s=>document.querySelector(s),HR=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],PAL=['#0a7cc2','#e00020','#5fa312','#e0a000','#802080','#0060a0','#2bb0e8'],CH=['PAUD','I','II','III','IV','V','VI','BIMBEL'];
let S;try{S=JSON.parse(localStorage[K])}catch{}S=S||{p:{nama:'',flc:'',wil:'Nias Selatan',koor:'',tgt:30},e:[],u:0};
const z=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,pd=s=>new Date(s+'T00:00'),add=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d},mon=d=>add(d,-((d.getDay()+6)%7));
const tm=t=>{const[a,b]=t.split(':');return a*60+ +b},du=e=>Math.max(0,(tm(e.b)-tm(e.a))/60),fh=h=>(Math.round(h*10)/10+'').replace('.',','),sh=l=>l.reduce((a,e)=>a+du(e),0);
const tg=()=>+S.p.tgt||30,nm=()=>S.p.nama||'guru',inW=m=>S.e.filter(e=>e.d>=iso(m)&&e.d<=iso(add(m,6))),mE=()=>S.e.filter(e=>e.d.startsWith(mo));
const ds=d=>`${d.getDate()} ${BL[d.getMonth()].slice(0,3)}`,fd=s=>{const d=pd(s);return `${HR[d.getDay()]}, ${d.getDate()} ${BL[d.getMonth()]} ${d.getFullYear()}`};
let tab='b',mo=iso(new Date()).slice(0,7),wm=mon(new Date()),cur=null;
const save=()=>{S.u=Date.now();localStorage[K]=JSON.stringify(S);hd()};
function hd(){const n=new Date();$('#dt').textContent=`${fd(iso(n))}${S.u?' · diperbarui '+ds(new Date(S.u))+' '+z(new Date(S.u).getHours())+'.'+z(new Date(S.u).getMinutes()):''}`;$('#net').textContent=navigator.onLine?'● Online':'● Offline'}
function ms(h){const t=tg(),x=Math.round((h-t)*10)/10;return x<0?['k',`Halo kak ${nm()}, kamu masih kurang nih jam mengajarnya. Kurang ${fh(-x)} jam lagi dari target ${t} jam.`]:x>0?['l',`Halo kak ${nm()}, jam mengajarmu lebih nih. Lebih ${fh(x)} jam dari target ${t} jam, jangan lupa istirahat ya!`]:['p',`Halo kak ${nm()}, mantap! Jam mengajar pekan ini pas ${t} jam. 🎉`]}
const mi=()=>`<input type="month" id="mo" value="${mo}" style="width:auto">`;
function vB(){const l=inW(wm),h=sh(l),[c,t]=ms(h),T=tg(),C=339.3,col={k:'var(--o)',p:'var(--g)',l:'var(--p)'}[c],e=add(wm,6),me=mE(),hari=new Set(me.map(x=>x.d)).size,hd_=me.filter(x=>x.h!=='').map(x=>+x.h);
 const bars=[0,1,2,3,4,5,6].map(i=>{const d=iso(add(wm,i)),x=sh(l.filter(e=>e.d==d));return `<div class="bar"><b>${x?fh(x):''}</b><i style="height:${Math.min(x/8,1)*85}%;${x?'background:'+PAL[i]:''}"></i><span>${HR[(i+1)%7].slice(0,3)}</span></div>`}).join('');
 let ws='',m=mon(pd(mo+'-01'));const last=new Date(+mo.slice(0,4),+mo.slice(5)  ,0);
 for(;m<=last;m=add(m,7)){const x=sh(inW(m)),k=ms(x)[0],on=iso(m)==iso(wm);ws+=`<div class="wr" data-w="${iso(m)}" style="${on?'font-weight:700':''}"><span>${ds(m)} – ${ds(add(m,6))}</span><span>${fh(x)} / ${T} jam <span class="ch ${k}">${{k:'kurang',p:'pas',l:'lebih'}[k]}</span></span></div>`}
 return `<div class="c"><div class="nv"><button data-a="pw">‹</button><b>Pekan ${ds(wm)} – ${ds(e)}</b><button data-a="nw">›</button></div>
 <div class="gw"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#e3edf5" stroke-width="12"/><circle cx="60" cy="60" r="54" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.min(h/T,1)*C} ${C}" transform="rotate(-90 60 60)"/></svg><div><div class="big">${fh(h)} <small style="color:#567">/ ${T} jam</small></div><small style="color:#567">${l.length} sesi pekan ini</small></div></div>
 <div class="msg ${c}">${t}</div><div class="bars">${bars}</div></div>
 <div class="c"><div class="nv"><h2>Ringkasan bulan</h2>${mi()}</div><div class="st"><div style="background:var(--b)"><b>${fh(sh(me))}</b>jam mengajar</div><div style="background:var(--r)"><b>${me.length}</b>sesi</div><div style="background:var(--g)"><b>${hari}</b>hari mengajar</div><div style="background:var(--p)"><b>${hd_.length?Math.round(hd_.reduce((a,b)=>a+b,0)/hd_.length):0}</b>rata-rata hadir</div></div></div>
 <div class="c"><h2>Jam per pekan</h2>${ws}</div>`}
function vJ(){const g=groupDays(S,mo);return `<div class="nv"><h2>Jurnal</h2>${mi()}</div>`+(g.length?g.map(d=>`<div class="dy">${fd(d.d)}</div>`+d.rows.map(e=>`<div class="se" data-e="${e.i}"><div>${wkt(e)}<small>${fh(du(e))} jam</small></div><div><b>${esc(e.k)||'-'}</b><small>${esc(e.m)}${e.h!==''?' · hadir '+e.h:''}</small>${e.n?`<small>⚠ ${esc(e.n)}</small>`:''}</div></div>`).join('')).join(''):'<div class="c">Belum ada catatan bulan ini. Tekan tombol + untuk mencatat sesi mengajar.</div>')}
function vU(){const g=groupDays(S,mo),n=mE().length;return `<div class="c"><div class="nv"><h2>Unduh agenda</h2>${mi()}</div><p>${n} sesi pada ${g.length} hari. Hasil unduhan memakai format resmi Agenda Mengajar (logo, judul &amp; kolom sama persis), hanya isinya yang berubah.</p>
 <button class="bt g" data-a="xl">📗 Unduh Excel (.xlsx)</button><button class="bt r" data-a="pdf">📕 Unduh PDF</button><button class="bt w" data-a="sh">📤 Bagikan file Excel</button></div>
 <div class="c"><h2>Cadangan data</h2><p style="font-size:13px">Simpan cadangan sebelum ganti HP.</p><button class="bt o" data-a="bk">Simpan cadangan (.json)</button><label class="bt w" style="display:block;text-align:center">Pulihkan cadangan<input type="file" id="rs" accept=".json" hidden></label></div>`}
function vF(){const p=S.p,i=(k,l,x='')=>`<label>${l}<input data-p="${k}" value="${esc(p[k])}" ${x}></label>`;return `<div class="c"><h2>Profil guru</h2>${S.p.nama?'':'<div class="msg k">Isi nama dulu ya kak, supaya sapaan &amp; file unduhan sesuai.</div>'}${i('nama','Nama guru')}${i('flc','FLC')}${i('wil','Wilayah')}${i('koor','Koordinator Pendidikan')}${i('tgt','Target jam mengajar per pekan','type=number inputmode=numeric')}<p style="font-size:12px;margin-top:8px;color:#567">Tahun ajaran &amp; bulan di file mengikuti bulan yang dipilih. Semua data tersimpan di HP ini dan bisa dipakai tanpa jaringan.</p><button class="bt p" id="ins" hidden>Pasang aplikasi di layar utama</button></div>`}
function R(){$('#v').innerHTML={b:vB,j:vJ,u:vU,f:vF}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#fab').hidden=tab=='f';if(window.dp&&$('#ins'))$('#ins').hidden=false}
function fo(id){const e=id?S.e.find(x=>x.i==id):{d:iso(new Date()),a:'07:30',b:'09:30',r:'',k:'',m:'',h:'',t:1,n:''};cur=id;const rk=[...new Set(S.e.map(x=>x.r).filter(Boolean))],on=new Set((e.k.replace(/BIMBEL/i,'').match(/PAUD|VI|IV|V|III|II|I/g)||[]).concat(/BIMBEL/i.test(e.k)?['BIMBEL']:[]));
 f.innerHTML=`<h2>${id?'Ubah':'Catat'} sesi mengajar</h2><label>Tanggal<input type="date" id="fd" value="${e.d}"></label><div class="g2"><label>Mulai<input type="time" id="fa" value="${e.a}"></label><label>Selesai<input type="time" id="fb" value="${e.b}"></label></div><label>Rekan mengajar (opsional)<input id="fr" list="lr" value="${esc(e.r)}" placeholder="mis. Ferdi"></label><datalist id="lr">${rk.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>Kelas</label><input id="fk" value="${esc(e.k)}"><div id="ch">${CH.map(c=>`<button type="button" class="chip ${on.has(c)?'on':''}">${c}</button>`).join('')}</div><label>Materi pembelajaran<textarea id="fm" rows="2">${esc(e.m)}</textarea></label><label>Jumlah hadir<input type="number" id="fh" min="0" inputmode="numeric" value="${e.h}"></label><label class="ck"><input type="checkbox" id="ft" ${e.t?'checked':''}> Ttd (√)</label><label>Kendala hari ini<textarea id="fn" rows="2">${esc(e.n)}</textarea></label>
 ${id?'':'<button type="button" class="bt w" data-a="cp">Salin dari sesi terakhir</button>'}<button type="button" class="bt" data-a="sv">Simpan</button>${id?'<button type="button" class="bt r" data-a="del">Hapus</button>':''}<button type="button" class="bt w" data-a="cl">Batal</button>`;f.showModal()}
const kv=()=>{const s=[...f.querySelectorAll('.chip.on')].map(c=>c.textContent),c=s.filter(x=>x!='BIMBEL');return s.includes('BIMBEL')?`BIMBEL (${c.join(', ')})`:c.join(', ')};
function sv(){const e={i:cur||Date.now(),d:$('#fd').value,a:$('#fa').value,b:$('#fb').value,r:$('#fr').value.trim(),k:$('#fk').value.trim(),m:$('#fm').value.trim(),h:$('#fh').value,t:$('#ft').checked?1:0,n:$('#fn').value.trim()};
 if(!e.d||!e.a||!e.b||tm(e.b)<=tm(e.a))return alert('Cek lagi tanggal dan jam mulai/selesai ya kak.');
 if(cur)S.e[S.e.findIndex(x=>x.i==cur)]=e;else S.e.push(e);mo=e.d.slice(0,7);if(tab=='b')wm=mon(pd(e.d));save();f.close();R()}
function pr(){const g=groupDays(S,mo),[y,m]=mo.split('-'),P=S.p;let n=0,t='';
 g.forEach((d,i)=>{d.rows.forEach((e,j)=>{t+=`<tr>${j?'<td></td><td></td>':`<td>${i+1}</td><td>${pd(d.d).getDate()}-${BL[pd(d.d).getMonth()].slice(0,3)}-${d.d.slice(2,4)}</td>`}<td>${wkt(e)}</td><td>${esc(guru(S,e))}</td><td>${esc(e.k)}</td><td><i>${esc(e.m)}</i></td><td>${e.h}</td><td>${e.t?'√':''}</td><td style="text-align:left">${esc(e.n)}</td></tr>`})});
 $('#pr').innerHTML=`<img src="logo-ytp.png" style="float:right;height:60px"><div style="text-align:center;font-weight:bold;font-size:13px">AGENDA MENGAJAR GURU YAYASAN TANGAN PENGHARAPAN<br>WILAYAH ${esc((P.wil||'').toUpperCase())}</div><table class="nb"><tr><td><b>FLC</b></td><td>: ${esc(P.flc)}</td><td><b>T.A.</b></td><td>: ${tAjar(mo)}</td></tr><tr><td><b>Wilayah</b></td><td>: ${esc(P.wil)}</td><td><b>Bulan</b></td><td>: ${BL[m-1]}</td></tr><tr><td colspan="2"><b>Koordinator Pendidikan</b> : ${esc(P.koor)}</td></tr></table><br><table><thead><tr>${['No','Tanggal','Waktu','Nama Guru','Kelas','Materi Pembelajaran','Jumlah Hadir','Ttd','Kendala hari ini'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${t}</tbody></table>`}
const nmX=()=>`Agenda_Mengajar_${BL[+mo.slice(5)-1]}_${mo.slice(0,4)}_${nm().replace(/\s+/g,'_')}.xlsx`,gt=(u,b)=>fetch(u).then(r=>b?r.arrayBuffer():r.text()),dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)};
document.addEventListener('click',async ev=>{const t=ev.target,b=t.closest('[data-t]'),a=t.closest('[data-a]')?.dataset.a;
 if(b){tab=b.dataset.t;R();scrollTo(0,0);return}if(t.id=='fab'){fo();return}
 const w=t.closest('[data-w]');if(w){wm=pd(w.dataset.w);scrollTo(0,0);R();return}
 const e=t.closest('[data-e]');if(e){fo(e.dataset.e);return}
 if(t.classList.contains('chip')){t.classList.toggle('on');$('#fk').value=kv();return}
 if(t.id=='ins'&&window.dp){dp.prompt();return}
 if(a=='pw'||a=='nw'){wm=add(wm,a=='pw'?-7:7);R()}
 else if(a=='cl')f.close();else if(a=='sv')sv();
 else if(a=='del'){if(confirm('Hapus sesi ini?')){S.e=S.e.filter(x=>x.i!=cur);save();f.close();R()}}
 else if(a=='cp'){const l=[...S.e].sort((x,y)=>x.d.localeCompare(y.d)||x.a.localeCompare(y.a)).pop();if(l){$('#fa').value=l.a;$('#fb').value=l.b;$('#fr').value=l.r;$('#fk').value=l.k;$('#fm').value=l.m;$('#fh').value=l.h;f.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',new RegExp('\\b'+c.textContent+'\\b').test(l.k.replace(/BIMBEL/i,'')) &&c.textContent!='BIMBEL'||c.textContent=='BIMBEL'&&/BIMBEL/i.test(l.k)))}}
 else if(a=='xl'||a=='sh'){if(!S.p.nama)return alert('Isi nama guru dulu di tab Profil ya kak.');try{const x=await buildXlsx(S,mo,gt);if(a=='sh'){const fl=new File([x],nmX(),{type:x.type});navigator.canShare?.({files:[fl]})?await navigator.share({files:[fl],title:nmX()}):dl(x,nmX())}else dl(x,nmX())}catch(er){alert('Gagal membuat file: '+er.message)}}
 else if(a=='pdf'){if(!S.p.nama)return alert('Isi nama guru dulu di tab Profil ya kak.');pr();setTimeout(()=>print(),200)}
 else if(a=='bk')dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'Cadangan_Agenda_YTP.json')});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id=='mo'&&t.value){mo=t.value;wm=mon(pd(mo+'-01'));R()}
 else if(t.dataset.p){S.p[t.dataset.p]=t.value;save()}
 else if(t.id=='rs'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.e||!d.p)throw 0;if(confirm('Ganti data di HP ini dengan cadangan?')){S=d;save();R()}}catch{alert('File cadangan tidak valid.')}};r.readAsText(t.files[0])}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.dp=e;R()});addEventListener('online',hd);addEventListener('offline',hd);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
const f=$('#f');hd();if(!S.p.nama)tab='f';R();
</script></body></html>
